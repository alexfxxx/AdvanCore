name: AdvanCore PR verification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: advancore
          POSTGRES_PASSWORD: advancore
          POSTGRES_DB: advancore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U advancore -d advancore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://advancore:advancore@127.0.0.1:5432/advancore
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Run full verification
        run: python -m pytest tests/ -q
