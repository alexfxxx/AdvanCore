services:
  postgres:
    image: postgres:16
    restart: unless-stopped

    environment:
      POSTGRES_DB: advancore
      POSTGRES_USER: advancore
      POSTGRES_PASSWORD: advancore_local_dev

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - advancore_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U advancore -d advancore"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  advancore_postgres_data:
    external: true
    name: advancore_advancore_postgres_data
